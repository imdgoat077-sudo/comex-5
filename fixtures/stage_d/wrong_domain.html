<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wrong Domain Overlay Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; position: relative; }
    #wrong-domain-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(100, 116, 139, 0.95);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 9999;
    }
    #wrong-domain-accept {
      background: #334155;
      color: white;
      border: 1px solid white;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    #real-target { padding: 12px 24px; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="wrong-domain-overlay">
    <div><strong>Domain Restriction:</strong> Policy registered for another domain.</div>
    <button id="wrong-domain-accept">Dismiss</button>
  </div>

  <h1>Underlying Application</h1>
  <button id="real-target">Real Target Button</button>

  <script>
    window.__real_clicks = 0;
    window.__dismiss_clicks = 0;

    document.getElementById('wrong-domain-accept').addEventListener('click', () => {
      window.__dismiss_clicks++;
    });
    document.getElementById('real-target').addEventListener('click', () => {
      window.__real_clicks++;
    });
  </script>
</body>
</html>
