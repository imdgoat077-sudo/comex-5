<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Multiple Overlays Fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 40px; position: relative; }
    #cookie-overlay {
      position: fixed;
      top: 0; left: 0; right: 0;
      background: rgba(30, 41, 59, 0.95);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 9998;
    }
    #disabled-overlay {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(185, 28, 28, 0.95);
      color: white;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 9999;
    }
    #real-target { padding: 12px 24px; font-size: 16px; cursor: pointer; margin-top: 80px; }
  </style>
</head>
<body>
  <div id="cookie-overlay">
    <div>Cookie Notice</div>
    <button id="cookie-accept">Accept Cookies</button>
  </div>

  <div id="disabled-overlay">
    <div>Secondary Banner</div>
    <button id="disabled-accept">Close Secondary</button>
  </div>

  <h1>Underlying Application</h1>
  <button id="real-target">Real Target Button</button>

  <script>
    window.__real_clicks = 0;
    window.__dismiss_clicks = 0;
    window.__disabled_clicks = 0;

    document.getElementById('cookie-accept').addEventListener('click', () => { window.__dismiss_clicks++; });
    document.getElementById('disabled-accept').addEventListener('click', () => { window.__disabled_clicks++; });
    document.getElementById('real-target').addEventListener('click', () => { window.__real_clicks++; });
  </script>
</body>
</html>
