<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Comex Deterministic 25-Action Benchmark Task</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    header {
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
    }
    h1 { font-size: 20px; margin: 0 0 8px 0; }
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      background: #e2e8f0;
      color: #334155;
    }
    .status-badge.active { background: #dcfce7; color: #166534; }
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #1e293b;
      cursor: pointer;
      transition: background 80ms, transform 50ms;
    }
    .btn:hover { background: #f1f5f9; }
    .btn:active { transform: scale(0.97); }
    .btn.clicked {
      background: #3b82f6;
      color: #ffffff;
      border-color: #2563eb;
    }
    .toggles {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }
    .toggle-card {
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      background: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }
    .scroll-container {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 16px;
      background: #ffffff;
      margin-bottom: 24px;
    }
    .spacer {
      height: 600px;
      background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
    }
    .submit-btn {
      padding: 10px 24px;
      background: #059669;
      color: #ffffff;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .submit-btn:hover { background: #047857; }
  </style>
</head>
<body>
  <header>
    <h1>Comex Controlled Deterministic Task</h1>
    <div>Status: <span id="task-status" class="status-badge">Idle</span> | Actions Completed: <span id="action-count">0</span>/25</div>
  </header>

  <!-- 15 Clickable Grid Buttons (Actions 1-15) -->
  <div class="grid" id="button-grid">
    <!-- Generated dynamically in script -->
  </div>

  <!-- 5 Interactive Toggles & Radios (Actions 16-20) -->
  <div class="toggles">
    <label class="toggle-card" id="card-toggle-1">
      <input type="checkbox" id="toggle-chk-1"> Option Alpha
    </label>
    <label class="toggle-card" id="card-toggle-2">
      <input type="checkbox" id="toggle-chk-2"> Option Beta
    </label>
    <label class="toggle-card" id="card-toggle-3">
      <input type="checkbox" id="toggle-chk-3"> Option Gamma
    </label>
    <label class="toggle-card" id="card-radio-1">
      <input type="radio" name="plan" id="radio-opt-1" checked> Standard Mode
    </label>
    <label class="toggle-card" id="card-radio-2">
      <input type="radio" name="plan" id="radio-opt-2"> High-Performance Mode
    </label>
  </div>

  <!-- Scroll Area (Actions 21-22: scroll to bottom target, then top) -->
  <div class="scroll-container" id="task-scroll-area">
    <div class="spacer">Scroll down to locate the deep verification button</div>
    <button class="btn" id="scroll-target-btn" style="width: 100%;">Deep Verification Button</button>
  </div>

  <!-- Input and Submission (Actions 23-25) -->
  <div class="form-row">
    <input type="text" id="task-text-input" placeholder="Type verification code...">
    <button class="btn" id="verify-input-btn">Check</button>
    <button class="submit-btn" id="final-submit-btn">Complete Task</button>
  </div>

  <div id="final-result" style="display: none; padding: 14px; background: #dcfce7; color: #166534; border-radius: 6px; font-weight: 600;">
    TASK COMPLETED SUCCESSFULLY
  </div>

  <script>
    window.__task_state = {
      actionCount: 0,
      actions: [],
      completed: false,
      startTime: performance.now(),
      endTime: 0
    };

    const countEl = document.getElementById('action-count');
    const statusEl = document.getElementById('task-status');

    function recordAction(actionName) {
      window.__task_state.actionCount++;
      window.__task_state.actions.push({
        action: actionName,
        t: performance.now()
      });
      countEl.textContent = window.__task_state.actionCount;
      statusEl.className = 'status-badge active';
      statusEl.textContent = `In Progress (${window.__task_state.actionCount})`;
    }

    // Build 15 buttons
    const grid = document.getElementById('button-grid');
    for (let i = 1; i <= 15; i++) {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.id = `action-btn-${i}`;
      btn.textContent = `Item ${i}`;
      btn.addEventListener('click', () => {
        btn.classList.toggle('clicked');
        recordAction(`click-btn-${i}`);
      });
      grid.appendChild(btn);
    }

    // Toggles
    ['toggle-chk-1', 'toggle-chk-2', 'toggle-chk-3', 'radio-opt-1', 'radio-opt-2'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        recordAction(`change-${id}`);
      });
    });

    // Deep scroll target button
    document.getElementById('scroll-target-btn').addEventListener('click', () => {
      recordAction('click-deep-scroll-btn');
    });

    // Verify input button
    document.getElementById('verify-input-btn').addEventListener('click', () => {
      recordAction('click-verify-input');
    });

    // Final submit
    document.getElementById('final-submit-btn').addEventListener('click', () => {
      recordAction('click-final-submit');
      window.__task_state.completed = true;
      window.__task_state.endTime = performance.now();
      statusEl.textContent = 'Completed';
      document.getElementById('final-result').style.display = 'block';
    });
  </script>
</body>
</html>
