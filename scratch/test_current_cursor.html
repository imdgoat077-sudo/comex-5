<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 60px;
    background: #f1f5f9;
    font-family: system-ui, sans-serif;
  }
  .card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    display: inline-block;
    position: relative;
    width: 300px;
    height: 300px;
  }
  .target-dot {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 6px;
    height: 6px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
  }
  .ripple-preview {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 5;
  }
  .cursor-container {
    position: absolute;
    left: 100px;
    top: 100px;
    width: 38px;
    height: 38px;
    z-index: 20;
  }
  .cursor-svg {
    width: 38px;
    height: 38px;
    display: block;
    filter: drop-shadow(0 2.5px 5px rgba(0, 0, 0, 0.45)) drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
  }
</style>
</head>
<body>
  <div class='card'>
    <div class='target-dot'></div>
    <div class='ripple-preview'></div>
    <div class='cursor-container'>
      <svg class='cursor-svg' viewBox='0 0 38 38' fill='none' xmlns='http://www.w3.org/2000/svg'>
        <path d='M 0.5 0.5 L 0.5 28.5 L 8.5 21.5 L 15 36.5 L 19.5 34.5 L 13 19.5 L 23.5 19.5 Z'
              fill='#000000'
              stroke='#ffffff'
              stroke-width='2.6'
              stroke-linejoin='round'
              stroke-linecap='round'/>
      </svg>
    </div>
  </div>
</body>
</html>
