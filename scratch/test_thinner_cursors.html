<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #f8fafc; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px 0; color: #cbd5e1; }
  .canvas {
    background: #ffffff;
    height: 180px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .btn {
    position: absolute;
    left: 40px;
    top: 50px;
    padding: 8px 20px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    font-size: 14px;
  }
  .ripple {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-box {
    position: absolute;
    left: 80px;
    top: 60px;
    z-index: 100;
  }
</style>
</head>
<body>
  <h1>Testing 'Bit Thinner' Variations</h1>
  <div class="grid">

    <!-- T1: Current Silhouette, but Thinner White Border (4.6px stroke = ~2.3px border) -->
    <div class="card">
      <h2>1. Thinner Border Only (2.3px)</h2>
      <div class="canvas">
        <button class="btn">Click Me</button>
        <div class="ripple"></div>
        <div class="cursor-box">
          <svg style="width: 36px; height: 36px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="-1.4 -1.4 36 36" fill="none">
            <path d="M 0.5 0.5 
                     L 8.5 30.5 
                     C 9.3 32.3 11.3 32.7 13 31.5 
                     L 19 19 
                     L 31.5 13 
                     C 32.7 11.3 32.3 9.3 30.5 8.5 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="4.6"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T2: Slightly Slimmer Wings & Body (Angle tightened by ~15%) + 4.8px Border -->
    <div class="card">
      <h2>2. Slimmer Body & Wings (Balanced)</h2>
      <div class="canvas">
        <button class="btn">Click Me</button>
        <div class="ripple"></div>
        <div class="cursor-box">
          <svg style="width: 35px; height: 35px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="-1.4 -1.4 35 35" fill="none">
            <!-- Wings brought inward from 31.5 to 27.5, notch at 17 -->
            <path d="M 0.5 0.5 
                     L 7.5 28 
                     C 8.2 29.6 10 30 11.5 29 
                     L 17 17 
                     L 29 11.5 
                     C 30 10 29.6 8.2 28 7.5 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="4.8"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T3: Elegant Slender Dart (Sleek aerodynamic profile) -->
    <div class="card">
      <h2>3. Slender Modern Dart</h2>
      <div class="canvas">
        <button class="btn">Click Me</button>
        <div class="ripple"></div>
        <div class="cursor-box">
          <svg style="width: 34px; height: 34px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="-1.3 -1.3 34 34" fill="none">
            <path d="M 0.5 0.5 
                     L 6.5 27 
                     C 7.2 28.5 8.8 28.8 10.2 27.8 
                     L 16 16 
                     L 27.8 10.2 
                     C 28.8 8.8 28.5 7.2 27 6.5 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="4.4"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T4: Refined Medium Slim (Between T1 and T2) -->
    <div class="card">
      <h2>4. Refined Medium Slim</h2>
      <div class="canvas">
        <button class="btn">Click Me</button>
        <div class="ripple"></div>
        <div class="cursor-box">
          <svg style="width: 36px; height: 36px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="-1.4 -1.4 36 36" fill="none">
            <path d="M 0.5 0.5 
                     L 8 29.5 
                     C 8.7 31.2 10.6 31.6 12.2 30.5 
                     L 18 18 
                     L 30.5 12.2 
                     C 31.6 10.6 31.2 8.7 29.5 8 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="5.0"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
