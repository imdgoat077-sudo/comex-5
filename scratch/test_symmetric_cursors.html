<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { font-size: 18px; margin-bottom: 20px; font-weight: 600; color: #f8fafc; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px 0; color: #cbd5e1; }
  .canvas {
    background: #ffffff;
    height: 180px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .target-crosshair {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 1px;
    height: 30px;
    background: #ef4444;
    transform: translateY(-15px);
    z-index: 200;
  }
  .target-crosshair-h {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 30px;
    height: 1px;
    background: #ef4444;
    transform: translateX(-15px);
    z-index: 200;
  }
  .target-dot {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 210;
  }
  .ripple-preview {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-box {
    position: absolute;
    left: 80px;
    top: 60px;
    z-index: 100;
  }
</style>
</head>
<body>
  <h1>Pure 45° Symmetrical Tailless Pointers (Strict y = x Symmetry)</h1>
  <div class="grid">

    <!-- SYM 1: Clean Chevron with Rounded Wings and Scooped Notch -->
    <div class="card">
      <h2>S1: Clean Symmetrical Chevron</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <!-- Strict y=x symmetry:
                 Tip: (2, 2)
                 Left Wing: (9, 32)
                 Left Wing Round: C (9.5, 33.5) (11, 34) (12.5, 33)
                 Notch: L (19.5, 19.5)
                 Right Wing Round: L (33, 12.5) C (34, 11) (33.5, 9.5) (32, 9)
                 Tip: L (2, 2)
            -->
            <path d="M 2 2 
                     L 9 32 
                     C 9.5 33.5 11 34 12.5 33 
                     L 19.5 19.5 
                     L 33 12.5 
                     C 34 11 33.5 9.5 32 9 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.8"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- SYM 2: Pillowy Wide (Matching user reference photo exactly!) -->
    <div class="card">
      <h2>S2: Exact Reference Match (Pillowy Wide)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 5px 12px rgba(0,0,0,0.48)) drop-shadow(0 1.5px 4px rgba(0,0,0,0.3));" viewBox="0 0 38 38" fill="none">
            <!-- In the user's uploaded photo:
                 - Wide rounded wings
                 - Inward notch has a smooth rounded scoop
                 - Thick white border
                 - Tip is tight & pointed
            -->
            <path d="M 2 2 
                     L 10 32 
                     C 10.8 33.8 12.8 34.2 14.5 33 
                     L 20.5 20.5 
                     L 33 14.5 
                     C 34.2 12.8 33.8 10.8 32 10 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="7"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- SYM 3: Curved Scooped Notch (Ultra-Smooth Bezier Inward) -->
    <div class="card">
      <h2>S3: Curved Scoop Notch (Super Elegant)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <!-- Smooth bezier curves on all segments -->
            <path d="M 2 2 
                     L 9.5 31.5 
                     C 10.2 33 11.8 33.5 13.2 32.5 
                     Q 17.5 24 20 20 
                     Q 24 17.5 32.5 13.2 
                     C 33.5 11.8 33 10.2 31.5 9.5 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.8"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- SYM 4: Deeper Notch + Plumper Wings (Bold & Chunky) -->
    <div class="card">
      <h2>S4: Bold Chunky Symmetrical Delta</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2.2px, -2.2px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 5px 11px rgba(0,0,0,0.48)) drop-shadow(0 1.5px 4px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
            <path d="M 2.2 2.2 
                     L 9 32.5 
                     C 9.8 34.2 12 34.6 13.5 33.3 
                     L 19 19 
                     L 33.3 13.5 
                     C 34.6 12 34.2 9.8 32.5 9 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="7.5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
