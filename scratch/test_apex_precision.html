<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }
  .card {
    background: #131c2e;
    border-radius: 14px;
    padding: 18px;
    border: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.highlight {
    border-color: #38bdf8;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
  }
  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.rec { background: #0284c7; color: #ffffff; }
  .card h2 { font-size: 14px; margin: 4px 0 0 0; color: #f8fafc; font-weight: 600; }
  .card .desc { font-size: 11px; color: #94a3b8; line-height: 1.4; margin: 0; }
  
  .views-row {
    display: flex;
    gap: 10px;
  }
  .scene {
    flex: 1;
    height: 140px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .scene.light {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .scene.dark {
    background: #18181b;
    border: 1px solid #27272a;
    background-image: radial-gradient(#3f3f46 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .sample-btn {
    position: absolute;
    left: 18px;
    top: 45px;
    padding: 7px 16px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    border-radius: 8px;
    font-size: 13px;
  }
  .crosshair {
    position: absolute;
    left: 55px;
    top: 55px;
    width: 1px;
    height: 1px;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: rgba(239, 68, 68, 0.4);
  }
  .crosshair::before { left: -15px; top: 0; width: 30px; height: 1px; }
  .crosshair::after { top: -15px; left: 0; height: 30px; width: 1px; }
  .cursor-wrap {
    position: absolute;
    left: 55px;
    top: 55px;
  }
  .zoom-scene {
    background: #070a10;
    height: 150px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-scene svg {
    transform: scale(3.0);
  }
</style>
</head>
<body>
  <h1>Rounded Apex Precision Test</h1>
  <div class="subtitle">Ensuring the rounded nose touches the target coordinate (0, 0) with zero subpixel offset while looking perfectly round.</div>

  <div class="grid" id="main-grid"></div>

  <script>
    const options = [
      {
        badge: 'SLIGHTLY ROUNDED',
        badgeClass: 'rec',
        title: 'Option 1: Soft-Edge Apex (r ≈ 2.0px)',
        desc: 'Takes the needle point off. Retains high sharp definition while rounding the tip softly.',
        highlight: false,
        size: 35,
        viewBox: '-0.2 -0.2 35 35',
        stroke: 4.5,
        // Coming up left edge to (1.8, 3.8), curving through apex (0.9, 0.9) to (3.8, 1.8)
        path: `M 1.8 3.8 
               C 1.1 2.3 2.3 1.1 3.8 1.8 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      },
      {
        badge: 'RECOMMENDED (BALANCED)',
        badgeClass: 'rec',
        title: 'Option 2: Beautifully Rounded Nose (r ≈ 2.8px)',
        desc: 'The sweet spot. Clearly and elegantly rounded top with a smooth pill curve at the apex.',
        highlight: true,
        size: 35,
        viewBox: '0 0 35 35',
        stroke: 4.4,
        // Coming up left edge to (2.5, 5.2), curving smoothly through apex (1.2, 1.2) to (5.2, 2.5)
        path: `M 2.5 5.2 
               C 1.4 2.8 2.8 1.4 5.2 2.5 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      },
      {
        badge: 'GENEROUSLY ROUNDED',
        badgeClass: 'rec',
        title: 'Option 3: Smooth Bubble Nose (r ≈ 3.6px)',
        desc: 'Pronounced rounded top. Soft tactile silhouette with smooth circular nose.',
        highlight: false,
        size: 35,
        viewBox: '0.2 0.2 35 35',
        stroke: 4.4,
        // Coming up left edge to (3.2, 6.5), curving through apex (1.5, 1.5) to (6.5, 3.2)
        path: `M 3.2 6.5 
               C 1.8 3.4 3.4 1.8 6.5 3.2 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      }
    ];

    const grid = document.getElementById('main-grid');
    options.forEach(opt => {
      const card = document.createElement('div');
      card.className = `card ${opt.highlight ? 'highlight' : ''}`;
      
      const svgCode = `
        <svg style="width: ${opt.size}px; height: ${opt.size}px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="${opt.viewBox}" fill="none">
          <path d="${opt.path}"
                fill="#000000"
                stroke="#ffffff"
                stroke-width="${opt.stroke}"
                stroke-linejoin="round"
                stroke-linecap="round"
                style="paint-order: stroke fill;"/>
        </svg>
      `;

      card.innerHTML = `
        <div>
          <span class="badge ${opt.badgeClass}">${opt.badge}</span>
          <h2>${opt.title}</h2>
        </div>
        <p class="desc">${opt.desc}</p>
        <div class="views-row">
          <div class="scene light">
            <div class="sample-btn">Button</div>
            <div class="crosshair"></div>
            <div class="cursor-wrap">${svgCode}</div>
          </div>
          <div class="scene dark">
            <div class="sample-btn" style="background:#0284c7;">Button</div>
            <div class="crosshair"></div>
            <div class="cursor-wrap">${svgCode}</div>
          </div>
        </div>
        <div class="zoom-scene">
          ${svgCode}
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
