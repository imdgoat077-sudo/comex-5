<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #090d16;
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 22px; margin-bottom: 6px; font-weight: 700; color: #38bdf8; }
  .subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: #131c2e;
    border-radius: 14px;
    padding: 16px;
    border: 1px solid #1e293b;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card.highlight {
    border-color: #38bdf8;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
  }
  .badge {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge.current { background: #334155; color: #94a3b8; }
  .badge.rec { background: #0284c7; color: #ffffff; }
  .card h2 { font-size: 14px; margin: 4px 0 0 0; color: #f8fafc; font-weight: 600; }
  .card .desc { font-size: 11px; color: #94a3b8; line-height: 1.4; margin: 0; }
  
  .views-row {
    display: flex;
    gap: 10px;
  }
  .scene {
    flex: 1;
    height: 130px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }
  .scene.light {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .scene.dark {
    background: #18181b;
    border: 1px solid #27272a;
    background-image: radial-gradient(#3f3f46 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .sample-btn {
    position: absolute;
    left: 15px;
    top: 40px;
    padding: 6px 14px;
    background: #2563eb;
    color: white;
    font-weight: 600;
    border-radius: 6px;
    font-size: 12px;
  }
  .cursor-wrap {
    position: absolute;
    left: 45px;
    top: 50px;
  }
  .zoom-scene {
    background: #070a10;
    height: 140px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .zoom-scene svg {
    transform: scale(2.8);
  }
</style>
</head>
<body>
  <h1>Rounded Tip / Nose Explorations</h1>
  <div class="subtitle">Making the top/apex smoothly rounded instead of sharp/pointed, with strict bilateral symmetry.</div>

  <div class="grid" id="main-grid"></div>

  <script>
    // In our thinned-base model:
    // Left edge goes from apex to (11.5, 26.5)
    // Left wing curve: C 12.3 28 14 28.2 15.3 27
    // Notch: L 18.2 18.2
    // Right wing curve start: L 27 15.3 C 28.2 14 28 12.3 26.5 11.5
    // Right edge goes from (26.5, 11.5) to apex
    
    // For rounded apex:
    // We replace the single point (0.5, 0.5) with a smooth rounded arc across the symmetry axis y = x.
    // Left edge stops at (x_t, y_t), then curves smoothly to (y_t, x_t).
    
    const options = [
      {
        badge: 'POINTED (BEFORE)',
        badgeClass: 'current',
        title: '0. Pointed Sharp Tip',
        desc: 'Current sharp apex at (0.5, 0.5). Notice the crisp pointed nose.',
        highlight: false,
        size: 35,
        viewBox: '-1.09 -1.09 35 35',
        stroke: 4.5,
        path: `M 0.5 0.5 
               L 11.5 26.5 
               C 12.3 28 14 28.2 15.3 27 
               L 18.2 18.2 
               L 27 15.3 
               C 28.2 14 28 12.3 26.5 11.5 
               Z`
      },
      {
        badge: 'SUBTLE ROUNDED',
        badgeClass: 'rec',
        title: '1. Softly Rounded Apex',
        desc: 'Subtle rounded nose (r ≈ 1.5px). Smoothly takes the sharp edge off while keeping high pointer precision.',
        highlight: false,
        size: 35,
        // Left edge ends at (1.5, 3.5), curves through (0.8, 0.8) to (3.5, 1.5)
        viewBox: '-1.0 -1.0 35 35',
        stroke: 4.4,
        path: `M 1.5 3.5 
               C 1.0 2.2 2.2 1.0 3.5 1.5 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      },
      {
        badge: 'RECOMMENDED SWEET SPOT',
        badgeClass: 'rec',
        title: '2. Smooth Balanced Rounded Tip',
        desc: 'Clean, elegant rounded nose (r ≈ 2.5px). Perfectly soft and friendly yet distinctly points.',
        highlight: true,
        size: 35,
        // Left edge ends at (2.2, 5.0), curves through (1.0, 1.0) with tangent to (5.0, 2.2)
        viewBox: '-0.8 -0.8 35 35',
        stroke: 4.4,
        path: `M 2.2 5.0 
               C 1.2 2.8 2.8 1.2 5.0 2.2 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      },
      {
        badge: 'EXTRA ROUNDED',
        badgeClass: 'rec',
        title: '3. Prominently Rounded Nose',
        desc: 'Generously rounded bullet/pebble tip (r ≈ 3.5px). Very smooth, modern, tactile aesthetic.',
        highlight: false,
        size: 35,
        // Left edge ends at (3.0, 6.5), curves through (1.3, 1.3) to (6.5, 3.0)
        viewBox: '-0.6 -0.6 35 35',
        stroke: 4.4,
        path: `M 3.0 6.5 
               C 1.5 3.2 3.2 1.5 6.5 3.0 
               L 26.5 11.5 
               C 28 12.3 28.2 14 27 15.3 
               L 18.2 18.2 
               L 15.3 27 
               C 14 28.2 12.3 28 11.5 26.5 
               Z`
      }
    ];

    const grid = document.getElementById('main-grid');
    options.forEach(opt => {
      const card = document.createElement('div');
      card.className = `card ${opt.highlight ? 'highlight' : ''}`;
      
      const svgCode = `
        <svg style="width: ${opt.size}px; height: ${opt.size}px; overflow: visible; filter: drop-shadow(0 3.5px 8px rgba(0,0,0,0.42)) drop-shadow(0 1px 3px rgba(0,0,0,0.25));" viewBox="${opt.viewBox}" fill="none">
          <path d="${opt.path}"
                fill="#000000"
                stroke="#ffffff"
                stroke-width="${opt.stroke}"
                stroke-linejoin="round"
                stroke-linecap="round"
                style="paint-order: stroke fill;"/>
        </svg>
      `;

      card.innerHTML = `
        <div>
          <span class="badge ${opt.badgeClass}">${opt.badge}</span>
          <h2>${opt.title}</h2>
        </div>
        <p class="desc">${opt.desc}</p>
        <div class="views-row">
          <div class="scene light">
            <div class="sample-btn">Click Me</div>
            <div class="cursor-wrap">${svgCode}</div>
          </div>
          <div class="scene dark">
            <div class="sample-btn" style="background:#0284c7;">Click Me</div>
            <div class="cursor-wrap">${svgCode}</div>
          </div>
        </div>
        <div class="zoom-scene">
          ${svgCode}
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
