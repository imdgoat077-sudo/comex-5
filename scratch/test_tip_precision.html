<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px 0; color: #cbd5e1; }
  .canvas {
    background: #ffffff;
    height: 180px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .target-dot {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 210;
  }
  .ripple-preview {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-box {
    position: absolute;
    left: 80px;
    top: 60px;
    z-index: 100;
  }
</style>
</head>
<body>
  <h1 style="font-size: 18px; margin-bottom: 20px;">Tip Sharpness & Border Perfection (Zoom in on red dot)</h1>
  <div class="grid">

    <!-- CANDIDATE P1: Round join with 7px stroke -->
    <div class="card">
      <h2>P1: Round Join (Stroke 7px)</h2>
      <div class="canvas">
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-1.8px, -1.8px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
            <path d="M 1.8 1.8 L 1.8 30.5 C 1.8 31.2 2.4 31.6 3.0 31.1 L 10.5 24.2 L 18 37.5 C 18.4 38.2 19.3 38.4 20.0 38.0 L 25.0 35.5 C 25.7 35.1 26.0 34.2 25.6 33.5 L 18.2 20.2 L 28.5 20.2 C 29.3 20.2 29.7 19.4 29.1 18.8 Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="7"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- CANDIDATE P2: Miter tip with rounded wing beziers -->
    <div class="card">
      <h2>P2: Crisp Pointed Tip (Tight Apex)</h2>
      <div class="canvas">
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(0px, 0px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
            <!-- Outer white border drawn with tight pointed tip at (0,0) -->
            <!-- Outer path outline -->
            <path d="M 0 0 
                     L 0 31 
                     C 0 32.5 1.5 33.2 2.6 32.2 
                     L 9.5 26 
                     L 16.5 38.5 
                     C 17.2 39.8 18.8 40.2 20.1 39.5 
                     L 24.5 37.2 
                     C 25.8 36.5 26.2 34.9 25.5 33.6 
                     L 18.5 21 
                     L 28.5 21 
                     C 30 21 30.8 19.5 29.8 18.4 
                     Z"
                  fill="#ffffff"
                  stroke="#ffffff"
                  stroke-width="3"
                  stroke-linejoin="round"
                  stroke-linecap="round"/>
            <!-- Inner pure black body -->
            <path d="M 3.5 4 
                     L 3.5 27 
                     L 10 21 
                     L 17 33.5 
                     L 21 31.5 
                     L 14 19 
                     L 24 19 
                     Z"
                  fill="#000000"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- CANDIDATE P3: Stroke 6.5px with stroke-miterlimit at tip -->
    <div class="card">
      <h2>P3: Stroke 6.5px (Clean 3.25px Border)</h2>
      <div class="canvas">
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-1.2px, -1.2px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.42)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
            <path d="M 1.2 1.2 L 1.2 29.5 C 1.2 30.2 1.8 30.6 2.4 30.1 L 9.8 23.5 L 17 36.5 C 17.4 37.2 18.3 37.4 19.0 37.0 L 24.0 34.5 C 24.7 34.1 25.0 33.2 24.6 32.5 L 17.5 19.5 L 27.5 19.5 C 28.3 19.5 28.7 18.7 28.1 18.1 Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- CANDIDATE P4: Ultra-Chunky Premium (Stem 9px, Stroke 7px, Soft Depth) -->
    <div class="card">
      <h2>P4: Ultra-Chunky (Premium Pro)</h2>
      <div class="canvas">
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-1.5px, -1.5px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4.5px 9px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.32));" viewBox="0 0 40 40" fill="none">
            <path d="M 1.5 1.5 L 1.5 30.5 C 1.5 31.3 2.2 31.7 2.8 31.2 L 10.5 24.5 L 18 38 C 18.4 38.8 19.4 39.0 20.2 38.6 L 25.5 36.0 C 26.3 35.6 26.6 34.6 26.2 33.8 L 18.8 20.5 L 29.5 20.5 C 30.4 20.5 30.8 19.6 30.2 19.0 Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="7.2"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
