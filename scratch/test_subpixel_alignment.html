<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
  }
  .card {
    background: #1e293b;
    border-radius: 10px;
    padding: 16px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 12px; margin: 0 0 8px 0; color: #cbd5e1; }
  .canvas {
    background: #ffffff;
    height: 150px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1px, transparent 1px);
    background-size: 10px 10px;
  }
  .target-crosshair {
    position: absolute;
    left: 60px;
    top: 50px;
    width: 1px;
    height: 40px;
    background: #ef4444;
    transform: translateY(-20px);
    z-index: 200;
  }
  .target-crosshair-h {
    position: absolute;
    left: 60px;
    top: 50px;
    width: 40px;
    height: 1px;
    background: #ef4444;
    transform: translateX(-20px);
    z-index: 200;
  }
  .target-dot {
    position: absolute;
    left: 60px;
    top: 50px;
    width: 3px;
    height: 3px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 210;
  }
  .ripple-preview {
    position: absolute;
    left: 60px;
    top: 50px;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-box {
    position: absolute;
    left: 60px;
    top: 50px;
    z-index: 100;
  }
</style>
</head>
<body>
  <h1 style="font-size: 16px; margin-bottom: 16px;">Subpixel Tip Alignment (Red Crosshair = Actuation Target)</h1>
  <div class="grid">
    <!-- Offset 0px -->
    <div class="card">
      <h2>Offset (0px, 0px)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div><div class="target-crosshair-h"></div><div class="target-dot"></div><div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(0px, 0px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <path d="M 0.5 0.5 L 8.5 30.5 C 9.3 32.3 11.3 32.7 13 31.5 L 19 19 L 31.5 13 C 32.7 11.3 32.3 9.3 30.5 8.5 Z"
                  fill="#000000" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Offset -0.5px -->
    <div class="card">
      <h2>Offset (-0.5px, -0.5px)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div><div class="target-crosshair-h"></div><div class="target-dot"></div><div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-0.5px, -0.5px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <path d="M 0.5 0.5 L 8.5 30.5 C 9.3 32.3 11.3 32.7 13 31.5 L 19 19 L 31.5 13 C 32.7 11.3 32.3 9.3 30.5 8.5 Z"
                  fill="#000000" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Offset -1.0px -->
    <div class="card">
      <h2>Offset (-1.0px, -1.0px)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div><div class="target-crosshair-h"></div><div class="target-dot"></div><div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-1.0px, -1.0px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <path d="M 0.5 0.5 L 8.5 30.5 C 9.3 32.3 11.3 32.7 13 31.5 L 19 19 L 31.5 13 C 32.7 11.3 32.3 9.3 30.5 8.5 Z"
                  fill="#000000" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Offset -1.5px -->
    <div class="card">
      <h2>Offset (-1.5px, -1.5px)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div><div class="target-crosshair-h"></div><div class="target-dot"></div><div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-1.5px, -1.5px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <path d="M 0.5 0.5 L 8.5 30.5 C 9.3 32.3 11.3 32.7 13 31.5 L 19 19 L 31.5 13 C 32.7 11.3 32.3 9.3 30.5 8.5 Z"
                  fill="#000000" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- Offset -2.0px -->
    <div class="card">
      <h2>Offset (-2.0px, -2.0px)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div><div class="target-crosshair-h"></div><div class="target-dot"></div><div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2.0px, -2.0px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <path d="M 0.5 0.5 L 8.5 30.5 C 9.3 32.3 11.3 32.7 13 31.5 L 19 19 L 31.5 13 C 32.7 11.3 32.3 9.3 30.5 8.5 Z"
                  fill="#000000" stroke="#ffffff" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round" style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
