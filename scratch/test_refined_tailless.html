<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 30px;
    background: #0b1120;
    color: #e2e8f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    border: 1px solid #334155;
  }
  .card h2 { font-size: 13px; margin: 0 0 10px 0; color: #94a3b8; }
  .canvas {
    background: #ffffff;
    height: 180px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 14px 14px;
  }
  .target-crosshair {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 1px;
    height: 30px;
    background: #ef4444;
    transform: translateY(-15px);
    z-index: 200;
  }
  .target-crosshair-h {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 30px;
    height: 1px;
    background: #ef4444;
    transform: translateX(-15px);
    z-index: 200;
  }
  .target-dot {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 210;
  }
  .ripple-preview {
    position: absolute;
    left: 80px;
    top: 60px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.2);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-box {
    position: absolute;
    left: 80px;
    top: 60px;
    z-index: 100;
  }
</style>
</head>
<body>
  <h1 style="font-size: 18px; margin-bottom: 20px;">Ultra-Refined Reference Delta Cursor (Exact Symmetry & Pure Curves)</h1>
  <div class="grid">

    <!-- T1: Exact 45° Symmetry, Rounded Wings, Deep Notch -->
    <div class="card">
      <h2>T1: Balanced 45° Symmetrical</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <!-- Tip (2,2), Left wing (9, 32), Notch (18, 20), Right wing (32, 9) -->
            <path d="M 2 2 
                     L 10 32.5 
                     C 10.4 33.5 11.5 33.8 12.3 33.1 
                     L 20.5 24 
                     L 32.5 12 
                     C 33.2 11.2 32.9 10.1 31.9 9.7 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T2: Subtle Asymmetric Ergonomic (Left wing slightly steeper for natural mouse feeling) -->
    <div class="card">
      <h2>T2: Ergonomic Asymmetric (Reference Match)</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3.5px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <!-- Left wing extends down to y=32.5, right wing extends to x=31.5, notch at (18.5, 23) -->
            <path d="M 2 2 
                     L 9.5 32 
                     C 10 33 11.1 33.3 11.9 32.6 
                     L 19 24.5 
                     L 30.5 24.5 
                     C 31.5 24.5 32.2 23.6 31.7 22.7 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.8"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T3: Rounded Pillowy Chevron (Thick 7.5px White Border, Soft Curves) -->
    <div class="card">
      <h2>T3: Pillowy Soft Rounded Contour</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2.2px, -2.2px);">
          <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 5px 11px rgba(0,0,0,0.48)) drop-shadow(0 1.5px 4px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
            <!-- Beautiful bezier rounded corners -->
            <path d="M 2.2 2.2 
                     L 9 32.5 
                     C 9.5 33.7 10.9 34 11.8 33.2 
                     L 19.5 25.5 
                     L 31 28.5 
                     C 32.1 28.8 33 27.9 32.7 26.8 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="7.5"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

    <!-- T4: Ultra-Refined Elegant Delta (Curved Inward Notch) -->
    <div class="card">
      <h2>T4: Elegant Curved Arch Notch</h2>
      <div class="canvas">
        <div class="target-crosshair"></div>
        <div class="target-crosshair-h"></div>
        <div class="target-dot"></div>
        <div class="ripple-preview"></div>
        <div class="cursor-box" style="transform: translate(-2px, -2px);">
          <svg style="width: 38px; height: 38px; overflow: visible; filter: drop-shadow(0 4.5px 10px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.28));" viewBox="0 0 38 38" fill="none">
            <!-- Curved smooth bezier notch between wings -->
            <path d="M 2 2 
                     L 9 32 
                     C 9.5 33.1 10.7 33.4 11.5 32.7 
                     L 18.5 25.5 
                     L 29 27.5 
                     C 30 27.7 30.8 26.9 30.5 25.9 
                     Z"
                  fill="#000000"
                  stroke="#ffffff"
                  stroke-width="6.8"
                  stroke-linejoin="round"
                  stroke-linecap="round"
                  style="paint-order: stroke fill;"/>
          </svg>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
