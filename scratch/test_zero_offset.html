<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #0f172a;
    color: #e2e8f0;
    font-family: system-ui, sans-serif;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 24px;
    border: 1px solid #334155;
    width: 320px;
    display: inline-block;
  }
  .canvas {
    background: #ffffff;
    height: 200px;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
    background-image: 
      radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
    background-size: 12px 12px;
  }
  .target-crosshair {
    position: absolute;
    left: 80px;
    top: 70px;
    width: 1px;
    height: 40px;
    background: #ef4444;
    transform: translateY(-20px);
    z-index: 200;
  }
  .target-crosshair-h {
    position: absolute;
    left: 80px;
    top: 70px;
    width: 40px;
    height: 1px;
    background: #ef4444;
    transform: translateX(-20px);
    z-index: 200;
  }
  .target-dot {
    position: absolute;
    left: 80px;
    top: 70px;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 210;
  }
  .ripple {
    position: absolute;
    left: 80px;
    top: 70px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.25);
    box-shadow: 0 0 8px rgba(56, 189, 248, 0.7);
    transform: translate(-50%, -50%);
    z-index: 90;
  }
  .cursor-container {
    position: absolute;
    left: 80px;
    top: 70px;
    width: 38px;
    height: 38px;
    z-index: 100;
  }
  .cursor-svg {
    width: 38px;
    height: 38px;
    display: block;
    overflow: visible;
    /* Soft premium drop shadow */
    filter: drop-shadow(0 4.5px 10px rgba(0, 0, 0, 0.45)) drop-shadow(0 1.5px 3.5px rgba(0, 0, 0, 0.28));
  }
</style>
</head>
<body>
  <div class="card">
    <h2 style="font-size: 14px; margin: 0 0 12px 0;">Zero-Offset Authoritative Tip Test</h2>
    <div class="canvas">
      <div class="target-crosshair"></div>
      <div class="target-crosshair-h"></div>
      <div class="target-dot"></div>
      <div class="ripple"></div>
      <div class="cursor-container">
        <!-- Path designed so the apex of the round white border is at (0, 0) -->
        <svg class="cursor-svg" viewBox="-1.8 -1.8 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 0.5 0.5 
                   L 8.5 30.5 
                   C 9.3 32.3 11.3 32.7 13 31.5 
                   L 19 19 
                   L 31.5 13 
                   C 32.7 11.3 32.3 9.3 30.5 8.5 
                   Z"
                fill="#000000"
                stroke="#ffffff"
                stroke-width="6.5"
                stroke-linejoin="round"
                stroke-linecap="round"
                style="paint-order: stroke fill;"/>
        </svg>
      </div>
    </div>
  </div>
</body>
</html>
