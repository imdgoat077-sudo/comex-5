<!DOCTYPE html>
<html>
<head>
<style>
  body {
    margin: 0;
    padding: 40px;
    background: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: #1e293b;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 30px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 40px;
  }
  .btn {
    padding: 10px 24px;
    background: #2563eb;
    color: white;
    font-weight: 500;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    position: relative;
  }
  .btn-green {
    background: #10b981;
  }
  .input {
    padding: 10px 16px;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    font-size: 15px;
    width: 200px;
    outline: none;
  }
  .card {
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    position: relative;
  }
  .target-marker {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #ef4444;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    z-index: 50;
  }
  .cursor-overlay {
    position: absolute;
    z-index: 100;
    pointer-events: none;
  }
  .ripple {
    position: absolute;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid #38bdf8;
    background: rgba(56, 189, 248, 0.25);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
    transform: translate(-50%, -50%);
    z-index: 40;
  }
</style>
</head>
<body>
  <div class="container">
    <h2>Simulated Real Webpage Interaction</h2>
    <div class="card">
      <div class="row">
        <div style="position: relative;">
          <button class="btn btn-green" id="play-btn">Play Game</button>
          <!-- Coordinate: center of Play Game button -->
          <div class="target-marker" style="left: 60px; top: 20px;"></div>
          <div class="ripple" style="left: 60px; top: 20px;"></div>
          <div class="cursor-overlay" style="left: 60px; top: 20px;">
            <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4.5px 8px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
              <path d="M 0 0 L 0 30 C 0 30.8 0.7 31.2 1.3 30.7 L 9 24 L 16.5 37.5 C 16.9 38.3 17.9 38.5 18.7 38.1 L 24 35.5 C 24.8 35.1 25.1 34.1 24.7 33.3 L 17.2 20 L 28 20 C 28.9 20 29.3 19.1 28.7 18.5 Z"
                    fill="#000000"
                    stroke="#ffffff"
                    stroke-width="7.2"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    style="paint-order: stroke fill;"/>
            </svg>
          </div>
        </div>

        <div style="position: relative;">
          <input class="input" value="https://google.com" id="search-input" />
          <div class="target-marker" style="left: 80px; top: 20px;"></div>
          <div class="ripple" style="left: 80px; top: 20px;"></div>
          <div class="cursor-overlay" style="left: 80px; top: 20px;">
            <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4.5px 8px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
              <path d="M 0 0 L 0 30 C 0 30.8 0.7 31.2 1.3 30.7 L 9 24 L 16.5 37.5 C 16.9 38.3 17.9 38.5 18.7 38.1 L 24 35.5 C 24.8 35.1 25.1 34.1 24.7 33.3 L 17.2 20 L 28 20 C 28.9 20 29.3 19.1 28.7 18.5 Z"
                    fill="#000000"
                    stroke="#ffffff"
                    stroke-width="7.2"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    style="paint-order: stroke fill;"/>
            </svg>
          </div>
        </div>

        <div style="position: relative;">
          <a href="#" style="color: #2563eb; font-weight: 600;">Privacy Policy Link</a>
          <div class="target-marker" style="left: 40px; top: 10px;"></div>
          <div class="ripple" style="left: 40px; top: 10px;"></div>
          <div class="cursor-overlay" style="left: 40px; top: 10px;">
            <svg style="width: 40px; height: 40px; overflow: visible; filter: drop-shadow(0 4.5px 8px rgba(0,0,0,0.45)) drop-shadow(0 1.5px 3px rgba(0,0,0,0.3));" viewBox="0 0 40 40" fill="none">
              <path d="M 0 0 L 0 30 C 0 30.8 0.7 31.2 1.3 30.7 L 9 24 L 16.5 37.5 C 16.9 38.3 17.9 38.5 18.7 38.1 L 24 35.5 C 24.8 35.1 25.1 34.1 24.7 33.3 L 17.2 20 L 28 20 C 28.9 20 29.3 19.1 28.7 18.5 Z"
                    fill="#000000"
                    stroke="#ffffff"
                    stroke-width="7.2"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                    style="paint-order: stroke fill;"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
